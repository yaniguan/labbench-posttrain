# CALiSol-23 Stage 1: Cold-Start SFT (1x A100/H100 or RTX 4090)
# Launch: python scripts/posttrain/calisol_pipeline.py --config configs/posttrain/calisol/sft_a100.yaml --methods sft
model_name: Qwen/Qwen3-1.7B
use_lora: true
task_mode: both
max_length: 1536
sft_max_design: 64
sft_max_predict: 512
sft_steps: 400
sft_lr: 2.0e-5
output_dir: outputs/calisol/sft_qwen3_1.7b
