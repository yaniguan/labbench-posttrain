# Config only, not run.
# PPO with GAE. KL on. examples/configs/ppo_math_1B.yaml sets the penalty to 0
# because that file is a DAPO-style PPO. This lab recipe does not.
defaults: examples/configs/ppo_math_1B.yaml
ppo:
  adv_estimator:
    name: gae
    gae_lambda: 0.95
    gae_gamma: 1.0
    normalize_advantages: true
loss_fn:
  reference_policy_kl_penalty: 0.04
  reference_policy_kl_type: k3
  use_kl_in_reward: true
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  token_level_loss: true
value_loss_fn:
  scale: 0.4
  cliprange: 0.2
policy:
  model_name: Qwen/Qwen2.5-0.5B
  precision: bfloat16
