# GSPO long-CoT sequence-level geometric-mean importance ratio recipe axis
# (`sequence_level_importance_ratios=true` + `sequence_level_importance_sampling_geometric_mean=true`).
grpo:
  use_dynamic_sampling: true
  dynamic_sampling_max_gen_batches: 4
  num_prompts_per_step: 32
  num_generations_per_prompt: 8
  overlong_filtering: true
  adv_estimator:
    name: gdpo
    normalize_rewards: true
  reward_shaping:
    enabled: true
    overlong_buffer_length: 1536
    overlong_buffer_penalty: 0.5
    clamp_overlong_penalty: true
  length_penalty:
    enabled: true
    mode: zmad
    coef: 0.05
    reasoning_only: true
loss_fn:
  reference_policy_kl_penalty: 0.01
  reference_policy_kl_type: k3
  sequence_level_importance_ratios: true
  sequence_level_importance_sampling_geometric_mean: true
  ratio_clip_min: 3.0e-4
  ratio_clip_max: 4.0e-4
  token_level_loss: false
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: icepop
  truncated_importance_sampling_ratio_min: 0.5
  truncated_importance_sampling_ratio: 2.0
