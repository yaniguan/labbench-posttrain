# TROPD (Trust-Region Multi-Teacher On-Policy Distillation) recipe axis:
# Student rolls out online; token advantages pull toward log(alpha*pi_T + (1-alpha)*pi_S) + BioEnv reward.
on_policy_distillation:
  enabled: true
  proximal_teacher_alpha: 0.5
  subtract_global_baseline: true
  task_reward_weight: 0.4
  distill_weight: 0.6
  teachers:
    - alias: reasoning_teacher
      model_name: Qwen/Qwen3-8B
      weight: 0.6
    - alias: domain_teacher
      model_name: Qwen/Qwen2.5-7B-Instruct
      weight: 0.4
loss_fn:
  disable_ppo_ratio: true
  token_level_loss: true
  reference_policy_kl_penalty: 0.005
  reference_policy_kl_type: k3
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: icepop
  truncated_importance_sampling_ratio_min: 0.5
  truncated_importance_sampling_ratio: 2.0
